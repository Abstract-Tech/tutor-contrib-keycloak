# https://packaging.python.org/en/latest/tutorials/packaging-projects/
# https://hatch.pypa.io/latest/config/build/

[project]
name = "tutor-contrib-keycloak"
description = "keycloak plugin for Tutor"
authors = [
  { name = "Emad Rad", email = "emad.ehsanrad@gmail.com" },
]
license = { text = "AGPL-3.0-only" }

readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">= 3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",

]
dependencies = [
    "tutor>=19.0.0,<23.0.0",
]

dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "tutor[dev]>=19.0.0,<23.0.0",
    "ruff",
    "build",
    "twine",
]

[tool.hatch.version]
path = "tutorkeycloak/__about__.py"

# https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels
[project.urls]
Documentation = "https://github.com/Abstract-Tech/tutor-contrib-keycloak#readme"
Issues = "https://github.com/Abstract-Tech/tutor-contrib-keycloak/issues"
Source = "https://github.com/Abstract-Tech/tutor-contrib-keycloak"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tutorkeycloak"]

[tool.hatch.build.targets.sdist]
# Disable strict naming, otherwise twine is not able to detect name/version
strict-naming = false
include = [ "/tutorkeycloak"]
exclude = ["tests*"]

[project.entry-points."tutor.plugin.v1"]
keycloak = "tutorkeycloak.plugin"
